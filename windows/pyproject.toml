[project]
name = "voiceink-win"
version = "0.1.0"
description = "VoiceInk for Windows: push-to-talk local dictation with filler-word removal"
license = "GPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "keyboard>=0.13.5",
    "numpy>=2",
    "pyperclip>=1.11",
    "pywhispercpp>=1.5.1",
    "sounddevice>=0.5.6",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
voiceink = "voiceink_win.__main__:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["voiceink_win"]

[tool.setuptools.package-data]
voiceink_win = ["filler_words.txt"]
